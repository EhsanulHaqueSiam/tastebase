name: Preview cleanup

# Destroys stage pr-<n> when the `preview` label is removed or the PR closes. Runs under
# pull_request_target, so the workflow and the Alchemy program come from main: no PR code runs here.
on:
  pull_request_target:
    types: [unlabeled, closed]

permissions:
  contents: read

jobs:
  destroy:
    name: Destroy preview
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      (
        (github.event.action == 'unlabeled' && github.event.label.name == 'preview') ||
        (github.event.action == 'closed' && contains(github.event.pull_request.labels.*.name, 'preview'))
      )
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STAGE: pr-${{ github.event.pull_request.number }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      ALCHEMY_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4 # default branch: never the PR head
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Never destroy prod
        run: '[ "$STAGE" != "prod" ] || { echo "refusing to destroy prod"; exit 1; }'
      - run: pnpm alchemy destroy --stage "$STAGE" --yes --no-input
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          STATS_GITHUB_TOKEN: ${{ secrets.STATS_GITHUB_TOKEN }}
