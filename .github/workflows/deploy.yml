name: Deploy

# Every push to main (merged PRs included) deploys stage prod. Manual runs redeploy main, for example
# after rotating a secret. Switched on by the DEPLOY_ENABLED variable that stacks/github.ts sets.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: Redeploy every resource, including ones with no detected changes.
        type: boolean
        default: false

permissions:
  contents: read
  statuses: write

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production
    # A manual run from another branch would deploy that branch to production.
    if: vars.DEPLOY_ENABLED == 'true' && github.repository == 'EhsanulHaqueSiam/tastebase' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TASTEBASE_DOMAIN: ${{ vars.TASTEBASE_DOMAIN }}
      ALCHEMY_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Deploy stage prod
        run: pnpm alchemy deploy --stage prod --yes --no-input ${{ inputs.force && '--force' || '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          STATS_GITHUB_TOKEN: ${{ secrets.STATS_GITHUB_TOKEN }}
      - name: Smoke test
        run: pnpm probe https://tastebase.ehsanulsiam.workers.dev --quiet
      - name: Commit status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo, sha: context.sha, state: "success",
              context: "Deploy / production", description: "Deployed to tastebase.ehsanulsiam.workers.dev",
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

  # The CLI (`npx tastebase`) bundles the registry, so every deploy publishes it too. npm trusts this workflow
  # (trusted publishing), so there is no npm token. package.json holds major.minor; the patch is this run's number.
  # shortcut: publishes even when only the site changed; add a paths check if the version churn ever matters.
  publish:
    name: Publish CLI to npm
    needs: deploy
    # Off until npm trusts this workflow (docs/operations/deploy.md); until then the CLI is published by hand.
    if: vars.NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm, registry-url: "https://registry.npmjs.org" }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: npm version "$(node -p 'require("./package.json").version.split(".").slice(0, 2).join(".")').${{ github.run_number }}" --no-git-tag-version
      - run: npm publish --access public
