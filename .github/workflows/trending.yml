name: trending
on:
  schedule: [{ cron: "17 5 * * *" }]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: node --experimental-strip-types scripts/trending.ts
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - run: |
          git config user.name "tastebase-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/registry/stats.json
          git diff --cached --quiet || git commit -m "chore: refresh trending stats" && git push
