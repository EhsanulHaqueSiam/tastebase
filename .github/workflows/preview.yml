name: Preview

# Labelling a same-repository PR `preview` deploys it to Alchemy stage pr-<n> and comments the URL.
# This runs the PR's own code with Cloudflare credentials, so forks never get it.
# Teardown is in preview-cleanup.yml and never runs PR code.
on:
  pull_request:
    types: [labeled, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy preview
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'preview')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STAGE: pr-${{ github.event.pull_request.number }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      ALCHEMY_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.event.pull_request.head.sha }}" }
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Deploy stage
        id: deploy
        run: |
          pnpm alchemy deploy --stage "$STAGE" --yes --no-input | tee "$RUNNER_TEMP/deploy.log"
          echo "url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | tail -1)" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          STATS_GITHUB_TOKEN: ${{ secrets.STATS_GITHUB_TOKEN }}
      - run: pnpm probe "${{ steps.deploy.outputs.url }}" --quiet
      - name: Comment the URL
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          body="Preview for $(git rev-parse --short HEAD): $URL (MCP: $URL/mcp)"
          gh pr comment "${{ github.event.pull_request.number }}" --edit-last --body "$body" 2>/dev/null             || gh pr comment "${{ github.event.pull_request.number }}" --body "$body"
