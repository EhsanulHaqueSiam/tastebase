name: Bug or wrong pick
description: Something broken, or tastebase recommends the wrong library.
body:
  - type: dropdown
    id: where
    attributes: { label: Where, options: [MCP answer (plan / pick / get / trending), Website, CLI (npx tastebase), Other] }
    validations: { required: true }
  - type: textarea
    id: input
    attributes: { label: Exact input, description: The brief or need you passed, or the page URL }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: What happened and what you expected }
    validations: { required: true }
